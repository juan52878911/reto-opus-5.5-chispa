[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chispa"
version = "0.1.0"
description = "SDK de Chispa: cliente de /v1/decide y «chispa train» (zero-shot, few-shot y con datos del cliente) en CPU"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Juan Bedoya", email = "user52878911@gmail.com"}]
keywords = ["clasificador", "zero-shot", "few-shot", "chispa", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Spanish",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []  # el cliente y «chispa train» zero-shot/few-shot son solo biblioteca estándar

[project.optional-dependencies]
yaml = ["pyyaml"]                         # esquemas .yaml; los .json no lo necesitan
torre = ["numpy", "onnx", "onnxruntime"]  # --torre: valida el ONNX de la torre y añade la sección TORR
l2 = ["numpy", "torch", "transformers", "scikit-learn", "pyyaml"]  # --ckpt / --conjunta (además necesitan el repositorio: model/l2)

[project.scripts]
chispa = "chispa.cli:main"

[tool.setuptools]
packages = ["chispa"]

[tool.setuptools.package-data]
chispa = ["entrenador_go/main.go", "entrenador_go/entrenar.go", "entrenador_go/evaluar.go", "entrenador_go/calib.go", "entrenador_go/plan.go", "entrenador_go/util.go", "entrenador_go/go.mod", "entrenador_go/go.sum", "entrenador_go/vendor/*/*"]
