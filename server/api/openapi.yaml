openapi: 3.1.0
info:
  title: chispa-server
  version: "1.0.0"
  description: Clasificador tipado (choice, score, noul) de bajo coste. El esquema viaja en la peticion, asi que decide sobre preguntas y opciones nuevas (zero-shot) sin reentrenar. Los limites son los valores por defecto; se cambian en la seccion limites del JSON de configuracion. Las longitudes se cuentan en BYTES UTF-8 como hace el servidor, y por eso se declaran con la extension x-max-bytes y no con maxLength (que cuenta caracteres). Presupuesto de torres: el servidor calcula como mucho max_torres_nuevas (64 por defecto) torres de esquemas nuevos POR PETICION, sumando todas sus preguntas; agotado, L2 no opina y la pregunta sube a la capa siguiente.
servers:
  - url: http://127.0.0.1:8090
paths:
  /v1/decide:
    post:
      operationId: decide
      summary: Decide una o varias preguntas sobre un mismo texto
      description: Validacion todo o nada, una pregunta mala rechaza la peticion entera. Los resultados van en el orden de questions. Con nonce, la misma peticion devuelve el resultado guardado. La clave de API (apiKeyBearer) solo se exige si la config trae api_keys; sin ellas la ruta esta abierta como siempre.
      security:
        - apiKeyBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideRequest"
            examples:
              zero_shot:
                summary: Esquema nuevo, solo con descripciones
                value: {"state":"Quiero cancelar mi tarjeta de credito porque me cobraron una cuota que no reconozco","questions":[{"id":"intencion","question":"Que quiere hacer el cliente?","kind":"choice","options":[{"id":"cancelar_producto","description":"Quiere dar de baja un producto"},{"id":"disputar_cobro","description":"Reclama un cobro que no reconoce"},{"id":"consultar_saldo","description":"Pregunta por su saldo"}]}]}
              noul_y_score:
                summary: Una pregunta si/no y una escala del 1 al 3
                value: {"state":"El pedido llego roto y nadie contesta","questions":[{"id":"n1","question":"Hay una queja?","kind":"noul"},{"id":"s1","question":"Que tan urgente es?","kind":"score","options":[{"id":"1"},{"id":"2"},{"id":"3"}],"nonce":"abc-1"}]}
              kind_invalido:
                value: {"state":"hola","questions":[{"id":"q1","question":"Tema?","kind":"raro","options":[{"id":"a"},{"id":"b"}]}]}
              opciones_repetidas:
                value: {"state":"hola","questions":[{"id":"q1","question":"Tema?","kind":"choice","options":[{"id":"a"},{"id":"a"}]}]}
              sin_preguntas:
                value: {"state":"hola","questions":[]}
              json_roto:
                value: {"state":"hola","pregunta":1}
      responses:
        "200":
          description: Un resultado por pregunta, en orden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecideResponse"
              examples:
                zero_shot:
                  value: {"results":[{"id":"intencion","kind":"choice","answer":"disputar_cobro","probs":{"cancelar_producto":0.2,"disputar_cobro":0.7,"consultar_saldo":0.1},"layer":"L2","escalate":false,"ms":3.2}]}
                noul_y_score:
                  value: {"results":[{"id":"n1","kind":"noul","answer":"true","probs":{"false":0.1,"true":0.9},"layer":"L0","escalate":false,"ms":0.1},{"id":"s1","kind":"score","answer":"3","probs":{"1":0.1,"2":0.2,"3":0.7},"layer":"L1","escalate":false,"ms":0.4,"nonce":"abc-1"}]}
        "400":
          description: Peticion no valida (ver codigos en ErrorCode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                kind_invalido:
                  value: {"error":{"code":"invalid_kind","message":"questions[0].kind: \"raro\" no valido (choice, score o noul)","question_id":"q1"}}
                opciones_repetidas:
                  value: {"error":{"code":"duplicate_option_id","message":"questions[0].options[1].id: \"a\" repetido","question_id":"q1"}}
                sin_preguntas:
                  value: {"error":{"code":"empty_questions","message":"questions: hace falta al menos una pregunta"}}
                json_roto:
                  value: {"error":{"code":"invalid_json","message":"JSON no valido: json: unknown field \"pregunta\""}}
        "401":
          description: Solo con api_keys en la config. Falta la cabecera Authorization Bearer o la clave es incorrecta (code unauthorized)
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Metodo distinto de POST
          headers:
            Allow:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Cuerpo mayor que limites.max_cuerpo (1 MiB por defecto)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Solo con api_keys. La clave agoto su rafaga y su rps (code rate_limited). Esperar Retry-After segundos (entero, minimo 1) antes de reintentar. Semantica de rps: el cubo cobra 1 token por peticion mas 1 por cada pregunta adicional, sin bajar de 0 (un lote valido vacia el cubo pero no deja deuda: tras esperar lo que tarde en llegar un token la clave vuelve a pasar). Con rps pequeno y lotes grandes, la tasa efectiva de preguntas es de unas rps por segundo mas la rafaga. Tambien sale como 429 con Retry-After cuando el servidor esta saturado (tope de peticiones en curso, que se toma tras leer el cuerpo)
          headers:
            Retry-After:
              description: Segundos a esperar antes de reintentar
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: La peticion supero -timeout (codigo timeout). Esperar Retry-After antes de reintentar
          headers:
            Retry-After:
              description: Segundos a esperar antes de reintentar
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healthz:
    get:
      operationId: healthz
      summary: Salud
      responses:
        "200":
          description: El servidor esta vivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ok:
                  value: {"status":"ok"}
  /metrics:
    get:
      operationId: metrics
      summary: Metricas en formato de texto Prometheus
      responses:
        "200":
          description: Contadores y latencias (chispa_peticiones_total, chispa_preguntas_total, chispa_decididas_total, chispa_escalados_total...). Para lo nuevo: torres al vuelo (chispa_torres_calculadas_total, chispa_torres_cache_aciertos_total, chispa_torres_esperas_total, chispa_torres_errores_total, chispa_torres_presupuesto_agotado_total, histograma chispa_torre_latencia_segundos), esquemas nuevos (chispa_esquema_nuevo_preguntas_total, chispa_esquema_nuevo_decididas_total, gauge chispa_esquema_nuevo_tau si hay τ propio), nonces repetidos servidos de caché (chispa_cache_nonce_aciertos_total) plazos vencidos (chispa_timeouts_total) recargas del modelo (chispa_recargas_total{resultado="ok"|"error"}) y, con api_keys, chispa_auth_rechazos_total y chispa_clave_peticiones_total{clave="<id>",resultado="ok"|"limitada"}. Con la opcion ConMetricasProtegidas del servidor pide Authorization Bearer con el admin_token o una clave de API (401 unauthorized si no); por defecto sigue abierto. Sin clave de API (publico)
          content:
            text/plain:
              schema:
                type: string
  /v1/admin/recargar:
    post:
      operationId: recargar
      summary: Recarga en caliente del modelo (.chispa y config) sin cortar peticiones
      description: "Solo existe si la config (-config) trae `admin_token`; si no, responde 404 not_found como cualquier ruta desconocida. Relee la config y el `.chispa`, arma un modelo nuevo y lo sustituye atomicamente (lo mismo que SIGHUP). Las peticiones en vuelo terminan sobre el modelo viejo. Las cachés (esquemas, torres, nonces) son del modelo: empiezan vacias con el nuevo, asi que un nonce anterior no devuelve la respuesta de otro modelo. Si el `.chispa` no abre o no valida, se queda el viejo. El propio `admin_token` solo se lee al arrancar. "
      security:
        - adminBearer: []
      responses:
        "200":
          description: Modelo nuevo en servicio
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  generation:
                    type: integer
              examples:
                ok:
                  value: {"status":"ok","generation":2}
        "401":
          description: Falta la cabecera Authorization Bearer o el token es incorrecto (code unauthorized)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El servidor no tiene admin_token configurado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Metodo distinto de POST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: La recarga fallo (code reload_failed); sigue el modelo anterior y chispa_recargas_total{resultado="error"} sube
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    apiKeyBearer:
      type: http
      scheme: bearer
      description: Clave de API opcional (config api_keys). Sin api_keys, /v1/decide no pide clave. /healthz y /metrics nunca la piden.
    adminBearer:
      type: http
      scheme: bearer
  schemas:
    DecideRequest:
      type: object
      additionalProperties: false
      required: [questions]
      properties:
        state:
          type: string
          x-max-bytes: 262144
          description: Texto que se clasifica, el mismo para todas las preguntas. Limite en BYTES UTF-8 (max_estado), no en caracteres.
        questions:
          type: array
          minItems: 1
          maxItems: 256
          description: Limite max_preguntas.
          items:
            $ref: "#/components/schemas/Question"
    Question:
      type: object
      additionalProperties: false
      required: [id, question, kind]
      properties:
        id:
          type: string
          minLength: 1
          x-max-bytes: 256
          description: Unico en la peticion. Max max_id BYTES UTF-8 (x-max-bytes), no caracteres.
        question:
          type: string
          minLength: 1
          x-max-bytes: 4096
          description: Max max_texto BYTES UTF-8 (x-max-bytes), no caracteres; con tildes y enes un caracter ocupa 2 bytes o mas.
        kind:
          type: string
          enum: [choice, score, noul]
        options:
          type: array
          maxItems: 256
          description: "choice y score: al menos 2, con id unico (max_opciones). En score los ids son libres para L0 y L1; la cabeza CORAL de L2 solo opina si son \"1\"..\"K\" en orden. noul: opcional; si va, solo los ids false y true."
          items:
            $ref: "#/components/schemas/Option"
        nonce:
          type: string
          x-max-bytes: 256
          description: Clave de idempotencia opcional (max max_id BYTES UTF-8). No se guardan bajo ella las respuestas de peticiones canceladas o con alguna capa fallida.
    Option:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          x-max-bytes: 256
        description:
          type: string
          x-max-bytes: 4096
          description: Max max_texto BYTES UTF-8. En zero-shot es lo unico que Chispa ve de la opcion. Ojo: si el modelo trae torres precalculadas (ESQUEMAS/CONJ), se buscan por hash(question, ids de opciones), que NO incluye description ni kind: con la misma pregunta e ids, L2 usa esas torres y no tiene en cuenta una description distinta (ver docs/03-api.md, "Qué identifica a un esquema").
    DecideResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Result"
    Result:
      type: object
      additionalProperties: false
      required: [id, kind, answer, probs, layer, escalate, ms]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [choice, score, noul]
        answer:
          type: string
          description: Id de la opcion elegida, o vacio si ninguna capa opino.
        probs:
          type: object
          additionalProperties:
            type: number
        layer:
          type: string
          description: Capa que contesto de esta API (L0, L1, L2, L3). Vale "escalar" cuando escalate es true, es decir, ninguna capa llego a su tau. El audio (A1) no entra por esta API y no aparece aqui; ver audio/README.md.
        escalate:
          type: boolean
        ms:
          type: number
        nonce:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Texto para humanos con la ruta del campo. No es estable, usa code.
        question_id:
          type: string
          description: Id de la pregunta implicada, cuando se conoce.
    ErrorCode:
      type: string
      enum: [invalid_json, request_too_large, method_not_allowed, not_found, empty_questions, too_many_questions, state_too_long, missing_id, missing_question, missing_kind, invalid_kind, too_few_options, too_many_options, invalid_options, missing_option_id, duplicate_question_id, duplicate_option_id, field_too_long, unauthorized, rate_limited, reload_failed, timeout]
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
