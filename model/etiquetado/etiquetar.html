<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Etiquetar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font:16px/1.4 system-ui,sans-serif;max-width:760px;margin:1.5em auto;padding:0 1em;color:#222}
#texto{background:#f4f4f4;border-radius:6px;padding:1em;white-space:pre-wrap;font-size:1.1em}
.op{display:block;width:100%;text-align:left;margin:.4em 0;padding:.6em;border:2px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font:inherit}
.op.sel{border-color:#06c;background:#e6f0ff}
.op small{display:block;color:#555}
#barra{display:flex;justify-content:space-between;color:#555;margin-bottom:.5em}
.oculto{display:none}
button.nav{margin-right:.5em;padding:.4em .8em}
#aviso{color:#a00}
</style>
</head>
<body>
<h1>Etiquetar</h1>
<div id="inicio">
  <p><label>Tu nombre: <input id="nombre" type="text"></label></p>
  <p><label>Fichero JSONL: <input id="fichero" type="file" accept=".jsonl,.json,.txt"></label></p>
  <button id="empezar">Empezar</button>
  <p id="aviso"></p>
</div>
<div id="trabajo" class="oculto">
  <div id="barra"><span id="progreso"></span><span id="quien"></span></div>
  <p><b id="pregunta"></b></p>
  <div id="texto"></div>
  <div id="opciones"></div>
  <p>
    <button class="nav" id="ant">&larr; Anterior</button>
    <button class="nav" id="sig">Siguiente &rarr;</button>
    <label><input type="checkbox" id="dudoso"> Dudoso (?)</label>
  </p>
  <p><button id="exportar">Exportar JSONL</button>
  <span id="estado"></span></p>
  <p><small>Atajos: 1-9 elige opción · &larr; &rarr; navegar · e = escalate · ? = dudoso</small></p>
</div>
<script>
// ==PURO==
function parseJSONL(texto) {
  var filas = [], errores = [];
  var lineas = String(texto).split(/\r?\n/);
  for (var i = 0; i < lineas.length; i++) {
    var l = lineas[i].trim();
    if (!l) continue;
    try {
      var f = JSON.parse(l);
      if (f && typeof f.id === "string" && typeof f.texto === "string" && Array.isArray(f.opciones)) {
        filas.push(f);
      } else { errores.push(i + 1); }
    } catch (e) { errores.push(i + 1); }
  }
  return {filas: filas, errores: errores};
}
function semillaDeNombre(nombre) {
  var h = 2166136261;
  for (var i = 0; i < nombre.length; i++) { h ^= nombre.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function barajar(filas, semilla) {
  var r = mulberry32(semilla), a = filas.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(r() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
// respuestas: {id: {etiqueta, ts, dudoso}}
function exportarJSONL(respuestas, anotador) {
  var ids = Object.keys(respuestas).sort(), out = [];
  for (var i = 0; i < ids.length; i++) {
    var r = respuestas[ids[i]];
    if (!r || !r.etiqueta) continue;
    out.push(JSON.stringify({id: ids[i], etiqueta: r.etiqueta, anotador: anotador,
                             ts: r.ts, dudoso: !!r.dudoso}));
  }
  return out.length ? out.join("\n") + "\n" : "";
}
// ==FIN==

var estado = {filas: [], resp: {}, i: 0, nombre: "", clave: ""};
function $(id) { return document.getElementById(id); }
function guardar() {
  try { localStorage.setItem(estado.clave, JSON.stringify(estado.resp)); }
  catch (e) { $("estado").textContent = "No se pudo guardar en el navegador: exporta a menudo."; }
}
function cargar() {
  try { var s = localStorage.getItem(estado.clave); return s ? JSON.parse(s) : {}; }
  catch (e) { return {}; }
}
function pintar() {
  var f = estado.filas[estado.i], r = estado.resp[f.id] || {};
  var hechas = Object.keys(estado.resp).filter(function (k) { return estado.resp[k].etiqueta; }).length;
  $("progreso").textContent = (estado.i + 1) + " / " + estado.filas.length + " · hechas: " + hechas;
  $("quien").textContent = estado.nombre;
  $("pregunta").textContent = f.pregunta || "";
  $("texto").textContent = f.texto;
  $("dudoso").checked = !!r.dudoso;
  var cont = $("opciones"); cont.innerHTML = "";
  f.opciones.forEach(function (o, k) {
    var b = document.createElement("button");
    b.className = "op" + (r.etiqueta === o ? " sel" : "");
    var t = document.createElement("span");
    t.textContent = (k < 9 ? (k + 1) + ". " : "") + o;
    b.appendChild(t);
    var d = f.descripciones && f.descripciones[o];
    if (d) { var s = document.createElement("small"); s.textContent = d; b.appendChild(s); }
    b.onclick = function () { elegir(o); };
    cont.appendChild(b);
  });
}
function elegir(o) {
  var f = estado.filas[estado.i], r = estado.resp[f.id] || {};
  estado.resp[f.id] = {etiqueta: o, ts: new Date().toISOString(), dudoso: !!r.dudoso};
  guardar();
  if (estado.i < estado.filas.length - 1) estado.i++;
  pintar();
}
function marcarDudoso() {
  var f = estado.filas[estado.i], r = estado.resp[f.id] || {};
  r.dudoso = !r.dudoso;
  if (r.etiqueta) r.ts = r.ts || new Date().toISOString();
  estado.resp[f.id] = r;
  guardar(); pintar();
}
function mover(d) {
  var n = estado.i + d;
  if (n >= 0 && n < estado.filas.length) { estado.i = n; pintar(); }
}
function exportar() {
  var txt = exportarJSONL(estado.resp, estado.nombre);
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], {type: "application/jsonl"}));
  a.download = "etiquetas_" + estado.nombre.replace(/[^\w-]+/g, "_") + ".jsonl";
  document.body.appendChild(a); a.click(); a.remove();
}
function empezar(texto) {
  var nombre = $("nombre").value.trim();
  if (!nombre) { $("aviso").textContent = "Escribe tu nombre."; return; }
  var p = parseJSONL(texto);
  if (!p.filas.length) { $("aviso").textContent = "El fichero no tiene filas válidas."; return; }
  estado.nombre = nombre;
  estado.filas = barajar(p.filas, semillaDeNombre(nombre));
  estado.clave = "etiquetar:" + nombre + ":" + p.filas.length + ":" + p.filas[0].id;
  estado.resp = cargar();
  estado.i = 0;
  for (var k = 0; k < estado.filas.length; k++) {
    if (!(estado.resp[estado.filas[k].id] || {}).etiqueta) { estado.i = k; break; }
  }
  if (p.errores.length) $("aviso").textContent = "Líneas ignoradas: " + p.errores.slice(0, 10).join(", ");
  $("inicio").classList.add("oculto"); $("trabajo").classList.remove("oculto");
  pintar();
}
$("empezar").onclick = function () {
  var fi = $("fichero").files[0];
  if (!fi) { $("aviso").textContent = "Elige un fichero."; return; }
  var rd = new FileReader();
  rd.onload = function () { empezar(String(rd.result)); };
  rd.readAsText(fi, "utf-8");
};
$("ant").onclick = function () { mover(-1); };
$("sig").onclick = function () { mover(1); };
$("dudoso").onchange = marcarDudoso;
$("exportar").onclick = exportar;
document.addEventListener("keydown", function (e) {
  if ($("trabajo").classList.contains("oculto") || e.ctrlKey || e.metaKey || e.altKey) return;
  var f = estado.filas[estado.i], k = e.key;
  if (k === "ArrowRight") mover(1);
  else if (k === "ArrowLeft") mover(-1);
  else if (k === "?") marcarDudoso();
  else if (k === "e" || k === "E") { if (f.opciones.indexOf("escalate") >= 0) elegir("escalate"); }
  else if (/^[1-9]$/.test(k)) { var o = f.opciones[+k - 1]; if (o !== undefined) elegir(o); }
  else return;
  e.preventDefault();
});
</script>
</body>
</html>
